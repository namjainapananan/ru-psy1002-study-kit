<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Study Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h2>Study Hub</h2>
    <button onclick="navigate('materials')">Materials</button>
    <button onclick="navigate('quiz')">Quiz</button>
  </nav>

  <main id="app">
    <!-- Section 1: Materials -->
    <section id="materials" class="page active">
      <h1>Study Materials</h1>
      <div class="material-card">
        <h3>Sample PDF</h3>
        <iframe src="sample.pdf" width="100%" height="400px"></iframe>
      </div>
      <div class="material-card">
        <h3>Diagram</h3>
        <img src="diagram.jpg" alt="Study Diagram" style="max-width:100%;">
      </div>
    </section>

    <!-- Section 2: Quiz -->
    <section id="quiz" class="page">
      <h1>Knowledge Check</h1>
      <div id="quiz-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
