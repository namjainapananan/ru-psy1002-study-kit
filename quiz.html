<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>PSY1002 STUDY KIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- Chapter & Mode Selection View -->
    <div id="selection-screen">
      <h2>เลือกบทเรียน หรือ โหมดการฝึก</h2>
      <div id="chapter-list"></div>
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      <button id="marathon-btn" class="marathon-btn">ทุกแบบฝึกหัดรวดเดียว</button>
    </div>

    <!-- Active Quiz View -->
    <div id="quiz-screen" class="hidden">
      <div id="status-bar" class="status-bar">
        <span id="quiz-title-text" style="font-weight: bold;"></span>
        <span id="progress-text"></span>
        <span id="score-text">Score: 0</span>
      </div>

      <h3 id="question-text">Loading question...</h3>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      
      <div id="summary-container" class="score-summary hidden">
        <div id="score-badge" class="score-badge">0%</div>
        <p id="summary-text"></p>

        <div id="review-container" class="review-container hidden">
          <div class="review-title">ทบทวน:</div>
          <div id="review-list"></div>
        </div>

        <button id="back-to-menu-btn" class="restart-btn">กลับหน้าหลัก</button>
      </div>

      <button id="next-btn" class="next-btn hidden">ข้อถัดไป</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
